<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#ffffff"/>
  <!-- Aleta con esquinas redondeadas arriba -->
  <rect x="32" y="26" width="36" height="16" rx="3" fill="#ef4444"/>
  <!-- Conexión trapezoidal entre aleta y cuerpo -->
  <polygon points="32,38 68,38 76,44 24,44" fill="#ef4444"/>
  <!-- Cuerpo principal -->
  <rect x="20" y="42" width="60" height="36" rx="6" fill="#ef4444"/>
  <!-- Cierre -->
  <rect x="64" y="55" width="14" height="10" rx="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="71" cy="60" r="1.6" fill="#ffffff"/>
</svg>